# Local full-stack deployment rehearsal. Production instructions: docs/self-hosting.md.
services:
  frontend:
    build: .
    restart: unless-stopped
    ports: ['127.0.0.1:${STUDIO_LOCAL_PORT:-5173}:80']
    environment:
      STUDIO_API_UPSTREAM: http://backend:8788
    depends_on:
      backend: { condition: service_healthy }
  backend:
    build: ../gym-studio-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      SITE_URL: ${STUDIO_SITE_URL:-http://127.0.0.1:5173}
      PORT: '8788'
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://studio:local-development-only@postgres:5432/studio
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_FROM: Gym Studio <studio@example.invalid>
      REQUIRE_EMAIL_VERIFICATION: 'true'
      AI_PROVIDER: mock
    depends_on:
      postgres: { condition: service_healthy }
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: local-development-only
    volumes: ['studio-postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studio -d studio']
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ['127.0.0.1:8025:8025']
volumes:
  studio-postgres:
